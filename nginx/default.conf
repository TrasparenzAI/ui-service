server {
    listen       80;
    server_name  localhost;

    # Evita redirect con URL assoluti http:// dietro al proxy
    absolute_redirect off;

    access_log  /dev/stdout;
    error_log   /dev/stderr warn;

    root   /usr/share/nginx/html;

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ^~ /badge/ {
        proxy_pass http://127.0.0.1:3001/badge/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # File del service worker e index: MAI in cache
    location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # File statici (hashati da Angular)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    # Qualsiasi altro path che non è un file reale: redirect alla route hash
    location / {
        try_files $uri @hash;
    }

    location @hash {
        rewrite ^/(.*)$ /#/$1 redirect;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}